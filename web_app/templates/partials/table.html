<div class="content">
    {% if measurement %}
    <div class="header">{{ measurement.timestamp.strftime('%Y-%m-%d %H:%M:%S') if measurement.timestamp else '-' }}</div>
    <div class="main-sensor">
        <span class="temperature" id="temp">{{ measurement.temperature }}</span>
        <span class="unit">°C</span>
    </div>

    <div class="details">
        <div class="detail-item">
            <label>Wilgotność</label>
            <value id="hum">{{ measurement.humidity }}</value><span style="font-size: 1.5rem; color: #aaa;">%</span>
        </div>
        <div class="detail-item">
            <label>Ciśnienie</label>
            <value id="press">{{ measurement.pressure }}</value><span style="font-size: 1.5rem; color: #aaa;"> hPa</span>
        </div>
    </div>
    {% else %}
        Brak pomiarów w bazie danych.
    {% endif %}
</div>
